<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>heyyERP · V-Rub Suspensions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E1C33; --ink2:#152846; --navy:#17325C; --blue:#2457A6; --blue2:#3C70C4; --sky:#E7EEF8; --sky2:#F1F5FB;
  --bg:#F3F5F8; --surface:#FFFFFF; --line:#DCE2EA; --line2:#EAEEF3; --text:#16202E; --muted:#5B6879; --faint:#8A95A5;
  --amber:#A86A12; --amberbg:#FBF1DF; --red:#B42318; --redbg:#FCE9E7; --green:#18744A; --greenbg:#E3F3EA; --violet:#5B4BB7; --violetbg:#EEEBFA;
  --rail:248px; --top:58px; --r:10px;
  --font:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --head:"Manrope","DM Sans",system-ui,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0C1422; --surface:#121D30; --line:#22324B; --line2:#1A2840; --text:#E6ECF5; --muted:#9BA9BD; --faint:#6F7E94;
  --sky:#1A2C4A; --sky2:#152540; --navy:#9DB8E6; --blue:#6E9BE3; --blue2:#8AB0EC;
  --amberbg:#3A2C12; --amber:#E6B55E; --redbg:#3A1715; --red:#F08B80; --greenbg:#12321F; --green:#6FD19E; --violetbg:#25204A; --violet:#AFA4F2;
}}
:root[data-theme="dark"]{
  --bg:#0C1422; --surface:#121D30; --line:#22324B; --line2:#1A2840; --text:#E6ECF5; --muted:#9BA9BD; --faint:#6F7E94;
  --sky:#1A2C4A; --sky2:#152540; --navy:#9DB8E6; --blue:#6E9BE3; --blue2:#8AB0EC;
  --amberbg:#3A2C12; --amber:#E6B55E; --redbg:#3A1715; --red:#F08B80; --greenbg:#12321F; --green:#6FD19E; --violetbg:#25204A; --violet:#AFA4F2;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue2);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* layout */
.app{display:grid;grid-template-columns:var(--rail) 1fr;height:100%;min-height:0}
.rail{background:var(--ink);color:#C9D4E5;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;padding:16px 18px 14px;border-bottom:1px solid #1E3253}
.brand .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(140deg,#3C70C4,#17325C);display:grid;place-items:center;font:800 13px var(--head);color:#fff;letter-spacing:-.5px}
.brand b{font:800 16px var(--head);color:#fff;letter-spacing:-.3px}
.brand small{display:block;font-size:11px;color:#8FA2C0;margin-top:-2px}
.nav{overflow-y:auto;padding:10px 10px 20px;flex:1;min-height:0}
.nav h6{font:600 11px var(--font);color:#6F84A6;margin:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;color:#C9D4E5;text-decoration:none;font-weight:500;cursor:pointer}
.nav a:hover{background:#17294A;color:#fff}
.nav a.on{background:#20396A;color:#fff}
.nav a .ic{width:18px;height:18px;flex:none;opacity:.85}
.nav a .ct{margin-left:auto;font-size:11px;background:#2B4A80;color:#fff;border-radius:10px;padding:0 7px;line-height:18px}
.nav a .ct.warn{background:#7A4E0D}
.railfoot{padding:12px 16px;border-top:1px solid #1E3253;font-size:12px;color:#8FA2C0;display:flex;gap:10px;align-items:center}
.avatar{width:28px;height:28px;border-radius:50%;background:#2B4A80;color:#fff;display:grid;place-items:center;font:700 11px var(--head);flex:none}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{height:var(--top);display:flex;align-items:center;gap:12px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--line);flex:none}
.burger{display:none;background:none;border:0;padding:6px;cursor:pointer}
.search{flex:1;max-width:480px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:0 10px;height:36px;cursor:text;color:var(--faint)}
.search kbd{margin-left:auto;font:600 11px var(--font);border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted)}
.sel{height:36px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 10px}
.topr{margin-left:auto;display:flex;gap:8px;align-items:center}
.iconbtn{height:36px;min-width:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface);display:grid;place-items:center;cursor:pointer;position:relative;padding:0 8px}
.iconbtn .dot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--red)}
.askbtn{height:36px;border:0;border-radius:8px;background:var(--navy);color:#fff;padding:0 14px;font-weight:600;display:flex;align-items:center;gap:8px;cursor:pointer}
:root[data-theme="dark"] .askbtn{background:#2457A6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .askbtn{background:#2457A6}}
.content{flex:1;overflow:auto;min-height:0;padding:22px 26px 60px}

/* page head */
.ph{display:flex;align-items:flex-end;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.ph h1{font:800 22px/1.2 var(--head);margin:0;letter-spacing:-.4px}
.ph p{margin:3px 0 0;color:var(--muted);max-width:72ch}
.ph .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:0 13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--blue2)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:var(--navy)}
.btn.ai{background:var(--violetbg);border-color:transparent;color:var(--violet)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.no{color:var(--red)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs a{padding:9px 14px;color:var(--muted);text-decoration:none;font-weight:600;border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer}
.tabs a.on{color:var(--text);border-bottom-color:var(--blue)}
.tabs a:hover{color:var(--text)}

/* blocks */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.g12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card h3{font:700 14.5px var(--head);margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h3 .r{margin-left:auto;font:500 12px var(--font);color:var(--muted)}
.card.flush{padding:0}.card.flush h3{padding:14px 16px 0}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px}
.kpi .l{color:var(--muted);font-size:12.5px}
.kpi .v{font:800 22px/1.25 var(--head);letter-spacing:-.4px;margin-top:2px}
.kpi .d{font-size:12px;margin-top:2px;color:var(--muted)}
.up{color:var(--green)}.dn{color:var(--red)}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-weight:600;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sky2);position:sticky;top:0}
.t td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
.t tr.click{cursor:pointer}.t tr.click:hover td{background:var(--sky2)}
.t td.n,.t th.n{text-align:right}
.t tfoot td{font-weight:700;background:var(--sky2)}
.b{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--sky);color:var(--navy)}
.b.g{background:var(--greenbg);color:var(--green)}.b.a{background:var(--amberbg);color:var(--amber)}.b.r{background:var(--redbg);color:var(--red)}.b.v{background:var(--violetbg);color:var(--violet)}.b.x{background:var(--line2);color:var(--muted)}
.code{font-weight:600;color:var(--navy)}
.muted{color:var(--muted)}.small{font-size:12.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters input,.filters select{height:32px;border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:0 10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:4px 11px;font-size:12.5px;cursor:pointer;font-weight:600;color:var(--muted)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
:root[data-theme="dark"] .chip.on{background:#2457A6;border-color:#2457A6}
.bar{height:7px;border-radius:5px;background:var(--line2);overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2);align-items:flex-start}
.li:last-child{border-bottom:0}
.li .t1{font-weight:600}
.ai-note{background:var(--violetbg);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:flex-start;color:var(--text)}
.ai-note .tag{font:700 11px var(--font);color:var(--violet);white-space:nowrap;margin-top:2px}
.ai-note p{margin:0}
.note{background:var(--sky2);border:1px dashed var(--line);border-radius:var(--r);padding:10px 12px;font-size:12.5px;color:var(--muted)}

/* flow strip — the signature */
.flow{display:grid;grid-template-columns:repeat(10,minmax(88px,1fr));gap:0;position:relative;overflow-x:auto;padding:6px 2px 4px}
.fs{position:relative;padding:12px 10px 10px;cursor:pointer;min-width:88px}
.fs::before{content:"";position:absolute;left:0;right:0;top:27px;height:4px;background:var(--line)}
.fs:first-child::before{left:50%}.fs:last-child::before{right:50%}
.fs .node{position:relative;width:34px;height:34px;border-radius:50%;margin:0 auto;background:var(--surface);border:3px solid var(--blue);display:grid;place-items:center;font:800 12px var(--head);color:var(--navy);z-index:1}
.fs.hot .node{border-color:var(--amber);color:var(--amber);background:var(--amberbg)}
.fs.crit .node{border-color:var(--red);color:var(--red);background:var(--redbg)}
.fs .nm{text-align:center;font-weight:700;font-size:12.5px;margin-top:6px}
.fs .sub{text-align:center;font-size:11.5px;color:var(--muted)}
.fs:hover .nm{color:var(--blue)}

/* drawer + modal */
.scrim{position:fixed;inset:0;background:rgba(10,18,32,.38);z-index:40;display:none}
.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:50;box-shadow:-10px 0 30px rgba(10,18,32,.18);transform:translateX(105%);transition:transform .22s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.on{transform:none}
.dh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dh h2{font:800 17px var(--head);margin:0}
.db{flex:1;overflow:auto;padding:16px 18px;min-height:0}
.df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.x{margin-left:auto;background:none;border:0;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:13px;margin-bottom:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:500}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600}
.form label.full{grid-column:1/-1}
.form input,.form select,.form textarea{height:36px;border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:0 10px;color:var(--text);font-weight:400;font-size:14px}
.form textarea{height:80px;padding:8px 10px;resize:vertical}
.steps{display:flex;gap:0;margin:4px 0 14px;flex-wrap:wrap}
.steps span{font-size:12px;padding:4px 10px;border:1px solid var(--line);margin-right:-1px;color:var(--muted);background:var(--surface)}
.steps span:first-child{border-radius:6px 0 0 6px}.steps span:last-child{border-radius:0 6px 6px 0}
.steps span.done{background:var(--greenbg);color:var(--green);border-color:transparent}
.steps span.cur{background:var(--navy);color:#fff;border-color:var(--navy)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(30px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:9px;z-index:80;opacity:0;transition:.2s;font-weight:500;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.on{opacity:1;transform:translateX(-50%)}

/* copilot */
.cop{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:60;transform:translateX(105%);transition:transform .22s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.cop.on{transform:none;box-shadow:-10px 0 30px rgba(10,18,32,.18)}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:0}
.m{max-width:92%;padding:9px 12px;border-radius:10px;font-size:13.5px;white-space:pre-wrap}
.m.u{align-self:flex-end;background:var(--navy);color:#fff}
:root[data-theme="dark"] .m.u{background:#2457A6}
.m.a{align-self:flex-start;background:var(--sky2);border:1px solid var(--line2)}
.sugg{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px}
.cin{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.cin input{flex:1;height:38px;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:var(--bg)}
.palette{position:fixed;top:12vh;left:50%;transform:translateX(-50%);width:min(560px,92vw);background:var(--surface);border:1px solid var(--line);border-radius:12px;z-index:90;box-shadow:0 20px 50px rgba(0,0,0,.3);display:none;overflow:hidden}
.palette.on{display:block}
.palette input{width:100%;border:0;border-bottom:1px solid var(--line);height:48px;padding:0 16px;font-size:15px;background:transparent;outline:none}
.palette .res{max-height:50vh;overflow:auto}
.palette .res div{padding:9px 16px;cursor:pointer;display:flex;gap:10px}
.palette .res div:hover,.palette .res div.on{background:var(--sky2)}

/* matrix */
.mx td.c{text-align:center;font-weight:700;font-size:17px;line-height:1}
.mx .y{color:var(--green)}.mx .p{color:var(--amber)}.mx .nn{color:var(--faint)}
.mx td.us{background:var(--sky2)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}

/* tablet shop floor */
.tablet{border:10px solid var(--ink);border-radius:22px;padding:16px;background:var(--bg);max-width:760px}
.bigbtn{height:56px;font-size:16px;border-radius:10px;font-weight:700;border:0;cursor:pointer}
.ocr{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.paper{background:#fff;color:#222;border:1px solid var(--line);border-radius:6px;padding:14px;font:12px/1.5 "Courier New",monospace;min-height:240px;position:relative;overflow:hidden}
.scan{position:absolute;left:0;right:0;height:3px;background:rgba(91,75,183,.6);box-shadow:0 0 12px rgba(91,75,183,.8);top:0;animation:scan 1.4s linear infinite}
@keyframes scan{to{top:100%}}
.hl{background:rgba(91,75,183,.18);border-radius:3px}
svg text{font-family:var(--font)}

@media (max-width:1100px){.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g21,.g12{grid-template-columns:1fr}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;left:0;top:0;bottom:0;width:min(280px,84vw);z-index:70;transform:translateX(-102%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px)}
  .rail.on{transform:none;box-shadow:10px 0 30px rgba(0,0,0,.3)}
  .burger{display:block}
  .top{padding:0 12px;gap:8px}
  .search span,.search kbd,.hide-sm{display:none}
  .search{flex:0 0 36px;padding:0;justify-content:center}
  .content{padding:16px 14px 60px}
  .g2,.g3,.ocr,.form{grid-template-columns:1fr}
  .kv{grid-template-columns:120px 1fr}
}

/* ---- V-Rub layer ---- */
:root{--lane-metal:#FBEDE3;--lane-rub:#E8F3E6;--lane-ext:#FBF4DC;--lane-metal-b:#E9C9AE;--lane-rub-b:#BBD8B4;--lane-ext-b:#E6D59A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--lane-metal:#2C2119;--lane-rub:#17281A;--lane-ext:#29250F;--lane-metal-b:#5A4130;--lane-rub-b:#2F5233;--lane-ext-b:#5A5022}}
:root[data-theme="dark"]{--lane-metal:#2C2119;--lane-rub:#17281A;--lane-ext:#29250F;--lane-metal-b:#5A4130;--lane-rub-b:#2F5233;--lane-ext-b:#5A5022}
.railfoot .who{flex:1;min-width:0}.railfoot .who b{display:block;color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.railfoot button{background:#20396A;border:0;color:#fff;border-radius:6px;padding:5px 9px;font-size:12px;cursor:pointer}
.sync{display:flex;align-items:center;gap:6px;height:36px;padding:0 10px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--faint)}.sync.live i{background:var(--green)}.sync.ro i{background:var(--amber)}
.sync .av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:700 9.5px var(--head);color:#fff;background:#3C70C4;margin-left:-6px;border:2px solid var(--surface)}
.login{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);overflow:auto}
.login[hidden]{display:none}
.login .side{background:var(--ink);color:#C9D4E5;padding:48px 44px;display:flex;flex-direction:column;gap:18px}
.login .side h1{font:800 30px/1.15 var(--head);color:#fff;margin:0;letter-spacing:-.6px}
.login .side p{margin:0;max-width:44ch;line-height:1.6}
.login .flowmini{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.login .flowmini span{font-size:12px;border:1px solid #2B4A80;border-radius:20px;padding:3px 10px;color:#C9D4E5}
.login .main{padding:48px 44px;display:flex;flex-direction:column;justify-content:center;gap:18px;max-width:640px}
.login form{display:grid;gap:12px;max-width:380px}
.login label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted)}
.login input[type=text],.login input[type=password]{height:42px;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:var(--surface);font-size:15px;color:var(--text)}
.login .err{color:var(--red);font-size:13px;min-height:18px}
.login .users{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.login .u{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 11px;cursor:pointer;text-align:left}
.login .u:hover,.login .u.on{border-color:var(--blue)}.login .u b{display:block;font-size:13px}.login .u small{color:var(--muted);font-size:11.5px}

.lane{border-radius:12px;padding:14px 14px 10px;margin-bottom:14px;border:1px solid}
.lane.metal{background:var(--lane-metal);border-color:var(--lane-metal-b)}.lane.rub{background:var(--lane-rub);border-color:var(--lane-rub-b)}.lane.ext{background:var(--lane-ext);border-color:var(--lane-ext-b)}
.lane h3{font:700 14.5px var(--head);margin:0 0 10px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.lane h3 small{font:500 12px var(--font);color:var(--muted)}
.stages{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px 0}
.stg{display:flex;align-items:center}
.stg .nd{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:118px;max-width:150px;cursor:pointer;display:flex;flex-direction:column;gap:3px;position:relative}
.stg .nd:hover{border-color:var(--blue)}
.stg .nd b{font-size:12.5px;line-height:1.25}
.stg .nd .c{font:800 17px var(--head);color:var(--navy)}
.stg .nd .c.z{color:var(--faint)}
.stg .nd.qa{border-left:4px solid var(--violet)}
.stg .nd.upn{background:transparent;border-style:dashed}
.stg .nd.alert .c{color:var(--amber)}.stg .nd.alert::after{content:'';position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--amber)}
.stg .ar{width:18px;text-align:center;color:var(--faint);font-weight:700}
.join{align-self:center;font-size:12px;font-weight:600;color:var(--navy);background:var(--surface);border:1px dashed var(--blue);border-radius:20px;padding:3px 10px;margin-left:6px}
.label{background:#fff;color:#111;border:1px solid #bbb;border-radius:6px;padding:12px 14px;max-width:420px;font:12px/1.45 Arial,sans-serif}
.label .t{font-weight:700;font-size:13px}.label svg{display:block;margin:8px 0 2px;width:100%;height:56px}
.timer{font-weight:700}

.ok-t{color:var(--green);font-weight:700}.no-t{color:var(--red);font-weight:700}
.denied{max-width:520px;margin:60px auto;text-align:center}
.inline-sel{height:30px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0 6px;font-size:12.5px}
.rulecard{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:12px 14px;margin-bottom:10px}

function cBars(data, o={}){
  const w=o.w||560, h=o.h||200, pad=28, max=Math.max(...data.map(d=>Math.max(d.v, d.v2||0)))*1.15||1;
  const bw=(w-pad*2)/data.length;
  let s=`<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="${esc(o.label||'chart')}">`;
  for (let i=0;i<=3;i++){ const y=h-22-(h-40)*i/3; s+=`<line x1="${pad}" x2="${w-6}" y1="${y}" y2="${y}" stroke="var(--line2)"/>`; s+=`<text x="${pad-4}" y="${y+4}" font-size="10" text-anchor="end" fill="var(--faint)">${o.fmt?o.fmt(max*i/3):N(max*i/3)}</text>`; }
  data.forEach((d,i)=>{
    const x=pad+i*bw, two=d.v2!=null, bww=two?bw*0.32:bw*0.55;
    const h1=(h-40)*d.v/max; s+=`<rect x="${x+(two?bw*0.16:bw*0.22)}" y="${h-22-h1}" width="${bww}" height="${h1}" rx="3" fill="${d.c||'var(--blue)'}"><title>${esc(d.l)}: ${o.fmt?o.fmt(d.v):N(d.v)}</title></rect>`;
    if (two){ const h2=(h-40)*d.v2/max; s+=`<rect x="${x+bw*0.52}" y="${h-22-h2}" width="${bww}" height="${h2}" rx="3" fill="${o.c2||'var(--amber)'}"><title>${esc(d.l)}: ${N(d.v2)}</title></rect>`; }
    s+=`<text x="${x+bw/2}" y="${h-6}" font-size="10.5" text-anchor="middle" fill="var(--muted)">${esc(d.l)}</text>`;
  });
  return s+'</svg>';
}
function cLine(series, labels, o={}){
  const w=o.w||560,h=o.h||200,pad=34; const all=series.flatMap(s=>s.d.filter(v=>v!=null));
  let mn=o.min??Math.min(...all), mx=o.max??Math.max(...all); if(mn===mx){mn-=1;mx+=1;} const rg=mx-mn; mn-=rg*0.08; mx+=rg*0.08;
  const X=i=>pad+(w-pad-10)*i/(labels.length-1), Y=v=>h-22-(h-36)*(v-mn)/(mx-mn);
  let s=`<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="${esc(o.label||'chart')}">`;
  for(let i=0;i<=3;i++){const v=mn+(mx-mn)*i/3,y=Y(v);s+=`<line x1="${pad}" x2="${w-6}" y1="${y}" y2="${y}" stroke="var(--line2)"/><text x="${pad-4}" y="${y+4}" font-size="10" text-anchor="end" fill="var(--faint)">${o.fmt?o.fmt(v):N(v)}</text>`;}
  (o.bands||[]).forEach(b=>{s+=`<line x1="${pad}" x2="${w-6}" y1="${Y(b.v)}" y2="${Y(b.v)}" stroke="${b.c}" stroke-dasharray="5 4"/><text x="${w-8}" y="${Y(b.v)-4}" font-size="10" text-anchor="end" fill="${b.c}">${esc(b.l)}</text>`;});
  labels.forEach((l,i)=>{ if(labels.length<=14||i%2===0) s+=`<text x="${X(i)}" y="${h-6}" font-size="10.5" text-anchor="middle" fill="var(--muted)">${esc(l)}</text>`;});
  series.forEach(se=>{ const pts=se.d.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);
    s+=`<polyline fill="none" stroke="${se.c||'var(--blue)'}" stroke-width="2.2" ${se.dash?'stroke-dasharray="5 4"':''} points="${pts.map(p=>p.join(',')).join(' ')}"/>`;
    pts.forEach((p,i)=>{ s+=`<circle cx="${p[0]}" cy="${p[1]}" r="2.8" fill="${se.c||'var(--blue)'}"><title>${esc(se.n||'')} ${labels[i]}: ${o.fmt?o.fmt(se.d[i]):se.d[i]}</title></circle>`;});
  });
  return s+'</svg>';
}
function cDonut(parts, o={}){
  const t=sum(parts,p=>p.v)||1, r=52, c=2*Math.PI*r; let off=0;
  let s=`<svg viewBox="0 0 140 140" width="${o.size||140}" role="img" aria-label="${esc(o.label||'')}">`;
  parts.forEach(p=>{ const l=c*p.v/t; s+=`<circle r="${r}" cx="70" cy="70" fill="none" stroke="${p.c}" stroke-width="18" stroke-dasharray="${l} ${c-l}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"><title>${esc(p.l)}: ${p.v}</title></circle>`; off+=l; });
  s+=`<text x="70" y="68" text-anchor="middle" font-size="18" font-weight="800" fill="var(--text)">${o.center||''}</text><text x="70" y="86" text-anchor="middle" font-size="10" fill="var(--muted)">${o.sub||''}</text></svg>`;
  return `<div class="row" style="gap:16px;align-items:center">${s}<div class="small">${parts.map(p=>`<div class="row" style="gap:6px"><i style="width:9px;height:9px;border-radius:2px;background:${p.c};display:inline-block"></i>${esc(p.l)} <b>${o.fmt?o.fmt(p.v):N(p.v)}</b></div>`).join('')}</div></div>`;
}

  const ar = S.invoices.filter(i=>i.total-i.paid>0).map(i=>`${i.no} ${custName(i.cust)} ${days(i.date)}d outstanding ${R(i.total-i.paid)} (terms ${cust(i.cust).terms}d)`);
  const ap = S.bills.filter(b=>!['Paid'].includes(b.status)).map(b=>`${b.no} ${vend(b.vendor).name} ${R(b.taxable+b.gst-b.tds)} due ${b.due} status ${b.status} match ${b.match}${vend(b.vendor).msme?' MSME':''}`);
  const sos = S.sos.filter(s=>s.status==='Open').map(s=>`${s.no} ${custName(s.cust)} due ${s.due}: `+s.lines.map(l=>`${l[0]} pending ${l[1]-l[2]}`).join(', '));
  const wos = S.wos.map(w=>`${w.no} ${w.item} ${w.done}/${w.qty} rej ${w.rej} ${w.status} ${w.line}`);
  const mach = S.machines.map(m=>`${m.id} ${m.name} OEE ${m.oee}% failure risk ${m.risk}%`);
  const pm = S.pms.map(p=>`${p.id} ${p.asset} ${p.task} due ${p.due} ${p.status}`);
  const pos = S.pos.filter(p=>!['Received'].includes(p.status)).map(p=>`${p.no} ${vend(p.vendor).name} ${p.status} next delivery ${(p.sched.find(s=>!s.done)||{}).d||'-'}`);
  const lv = S.leaves.filter(l=>l.status==='Pending').map(l=>`${l.no} ${emp(l.emp).name} ${l.type} ${l.days}d`);
  return `Company: V-Rub Suspensions Pvt Ltd (rubber-to-metal suspension parts maker). Today: ${TODAY.toDateString()}. Data is a demo dataset.\nItems below reorder level:\n${below.join('\n')}\nOpen receivables:\n${ar.join('\n')}\nOpen payables:\n${ap.join('\n')}\nOpen sales orders:\n${sos.join('\n')}\nWork orders:\n${wos.join('\n')}\nMachines:\n${mach.join('\n')}\nPreventive maintenance:\n${pm.join('\n')}\nOpen POs:\n${pos.join('\n')}\nPending leave:\n${lv.join('\n')}\nApprovals pending: ${pendingApprovals()}`;
}
function localAnswer(q){
  q=q.toLowerCase();
  if (/reorder|rop|below|short|stock out|low stock/.test(q)){ const b=S.items.filter(i=>stockOf(i.code)<i.rop); return `${b.length} items are below reorder level:\n`+b.map(i=>`• ${i.code} ${i.name} — ${N(stockOf(i.code))} ${i.uom} vs ROP ${N(i.rop)} (suggested order ${N(i.roq)})`).join('\n')+`\n\nOpen Inventory → Reorder to raise indents in one click.`; }
  if (/overdue|receiv|collect|debtor|outstanding/.test(q)){ const o=S.invoices.filter(i=>i.total-i.paid>0&&days(i.date)>cust(i.cust).terms).sort((a,b)=>days(b.date)-days(a.date)); return `Overdue receivables total ${L(sum(o,i=>i.total-i.paid))} across ${o.length} invoices:\n`+o.map(i=>`• ${custName(i.cust)} — ${i.no}, ${days(i.date)} days, ${R(i.total-i.paid)}`).join('\n')+`\n\nThe collections voice agent has called 2 of these this week.`; }
  if (/payable|pay|msme|vendor due|creditor/.test(q)){ const b=S.bills.filter(x=>['Approved','Scheduled'].includes(x.status)); return `Approved payables: ${L(sum(b,x=>x.taxable+x.gst-x.tds))}. MSME vendors to pay within 45 days (Sec 43B(h)):\n`+b.filter(x=>vend(x.vendor).msme).map(x=>`• ${vend(x.vendor).name} ${x.no} — ${days(x.date)} days old`).join('\n'); }
  if (/oee|machine|breakdown|maint|press/.test(q)){ const m=[...S.machines].sort((a,b)=>b.risk-a.risk)[0]; return `Highest failure risk: ${m.name} (${m.id}) at ${m.risk}% in the next 7 days — OEE ${m.oee}%, last PM ${fd(m.last)}. PM-0310 on this press is overdue by 4 days and today's breakdown BD-26-0091 cost 25 minutes. Recommend completing PM-0310 in shift C and stocking 8 heater cartridges.`; }
  if (/dispatch|deliver|sales order|so /.test(q)){ const s=S.sos.filter(x=>x.status==='Open').sort((a,b)=>a.due.localeCompare(b.due)); return `Next dispatches due:\n`+s.slice(0,4).map(x=>`• ${fd(x.due)} — ${custName(x.cust)} ${x.no}: `+x.lines.filter(l=>l[1]>l[2]).map(l=>`${l[0]} ×${N(l[1]-l[2])}`).join(', ')).join('\n'); }
  if (/leave|attendance|payroll|salary/.test(q)){ return `${S.leaves.filter(l=>l.status==='Pending').length} leave requests are pending. Payroll for Sep-26 is ready to run: ${S.emps.length} employees, estimated gross ${L(sum(S.emps,e=>e.gross))}.`; }
  if (/gst|gstr|itc|e-invoice|eway|e-way/.test(q)){ return `GSTR-1 for Sep-26 is due 11-Oct. 2B reconciliation shows 2 mismatches worth ₹19,620 ITC at risk (Unique Packaging qty variance and one invoice missing from 2B). All 10 sales invoices this month have IRN and e-way bills.`; }
  if (/scrap|reject/.test(q)){ const ok=sum(S.prodLog,p=>p.ok), rej=sum(S.prodLog,p=>p.rej); return `Last 2 days: ${N(ok)} OK, ${N(rej)} rejected (${(rej*100/(ok+rej)).toFixed(2)}%). Press line B has the highest rejection — flash thickness NCR-26-064 is open in containment.`; }
  return `I can answer from live ERP data — try asking about stock below reorder level, overdue receivables, MSME payables, machine risk, upcoming dispatches, GST status, scrap, or leave.`;
}
function renderMsgs(){ $('#msgs').innerHTML = copHist.map(m=>`<div class="m ${m.role==='user'?'u':'a'}">${esc(m.content)}</div>`).join(''); $('#msgs').scrollTop = 1e9; }
async function ask(q){
  if (!q.trim()) return; copHist.push({role:'user',content:q}); copHist.push({role:'assistant',content:'Thinking…'}); renderMsgs();
  const last = copHist[copHist.length-1];
  if (SAMPLE){
    try {
      const hist = copHist.slice(0,-1).slice(-8); while(hist.length && hist[0].role!=='user') hist.shift();
      const turns = hist.map((m,i,arr)=> (i===arr.length-1) ? {role:'user', content:`You are heyyERP Copilot inside an ERP for V-Rub Suspensions. Answer briefly (under 150 words), plainly, using only this live data; cite document numbers. If the data doesn't cover it, say so.\n\nDATA:\n${copContext()}\n\nQUESTION: ${m.content}`} : m);
      await SAMPLE(turns, { modelTier:'quick', cache:false, onText: ({text}) => { last.content = text; renderMsgs(); } });
      return;
    } catch(e){ if (e && e.text) { last.content = e.text; renderMsgs(); return; } }
  }
  await new Promise(r=>setTimeout(r,500)); last.content = localAnswer(q); renderMsgs();
}

ACT.dispatch = p => { const [no,idx]=p.split('|'); const s=S.sos.find(x=>x.no===no); const l=s.lines[+idx]; const it=item(l[0]); const q=Math.min(l[1]-l[2], stockOf(l[0]));

  if (tab==='ageing'){ const rows=S.lots.map(l=>({...l,it:item(l.item),age:days(l.rcv)})); const bk=a=>a<=30?'0-30':a<=90?'31-90':a<=180?'91-180':'180+'; const agg={'0-30':0,'31-90':0,'91-180':0,'180+':0}; rows.forEach(r=>agg[bk(r.age)]+=r.qty*r.it.rate);

function runMRP(){
  const fgNeed = {};
  S.sos.filter(s=>s.status==='Open').forEach(s=>s.lines.forEach(l=>{ fgNeed[l[0]]=(fgNeed[l[0]]||0)+(l[1]-l[2]); }));
  const fgRows = Object.entries(fgNeed).map(([c,q])=>{ const st=stockOf(c), wip=sum(S.wos.filter(w=>w.item===c&&w.status!=='Completed'),w=>w.qty-w.done); const net=Math.max(0,q-st-wip); return {c,q,st,wip,net}; });
  const rm = {};
  fgRows.forEach(r=>{ const b=S.boms[r.c]; if(!b) return; const make = r.net + item(r.c).rop*0.5; b.lines.forEach(([rc,per])=>{ rm[rc]=(rm[rc]||0)+make*per; }); });
  // also planned/in-progress WOs consume
  S.wos.filter(w=>w.status!=='Completed').forEach(w=>{ const b=S.boms[w.item]; b.lines.forEach(([rc,per])=>{ rm[rc]=(rm[rc]||0)+(w.qty-w.done)*per; }); });
  const rmRows = Object.entries(rm).map(([c,req])=>{ const it=item(c); const st=stockOf(c); const onPO=sum(S.pos.filter(p=>p.status!=='Received'&&p.appr==='Approved').flatMap(p=>p.lines.map((l,i)=>l[0]===c?l[1]-(p.recv[i]||0):0))); const short=Math.max(0, req + it.rop*0.5 - st - onPO); return {c,req,st,onPO,short,order:short?Math.max(short,it.roq):0}; });
  return {fgRows, rmRows};
}

function gantt(){
  const lines=['Press line A','Press line B','Press line C','Assembly cell'], d0=-4, d1=7, W=760, lw=110, cw=(W-lw)/(d1-d0);
  let s=`<div class="tw"><svg viewBox="0 0 ${W} ${lines.length*38+30}" width="100%" style="min-width:600px">`;
  for(let d=d0; d<=d1; d++){ const x=lw+(d-d0)*cw; s+=`<line x1="${x}" x2="${x}" y1="18" y2="${lines.length*38+24}" stroke="var(--line2)"/>`; if(d<d1) s+=`<text x="${x+cw/2}" y="12" font-size="10" text-anchor="middle" fill="${d===0?'var(--blue)':'var(--muted)'}">${fd(dFwd(d))}</text>`; }
  const tx=lw+(0-d0)*cw; s+=`<line x1="${tx}" x2="${tx}" y1="18" y2="${lines.length*38+24}" stroke="var(--blue)" stroke-width="2"/>`;
  lines.forEach((ln,i)=>{ const y=24+i*38; s+=`<text x="0" y="${y+18}" font-size="12" fill="var(--text)" font-weight="600">${ln}</text>`;
    S.wos.filter(w=>w.line===ln).forEach(w=>{ const a=Math.max(d0,-days(w.start)), b=Math.min(d1,-days(w.end)+1); if(b<=d0||a>=d1) return; const x=lw+(a-d0)*cw, wd=(b-a)*cw-3; const col=w.status==='Completed'?'var(--green)':w.status==='Planned'?'var(--line)':'var(--blue)';
      s+=`<g ${A('go','manufacturing/wip')} style="cursor:pointer"><rect x="${x}" y="${y}" width="${wd}" height="26" rx="5" fill="${col}" opacity=".9"/><text x="${x+6}" y="${y+17}" font-size="11" fill="${w.status==='Planned'?'var(--text)':'#fff'}" font-weight="600">${w.no} · ${item(w.item).code}</text></g>`; }); });
  return s+'</svg></div>';
}
ACT.saveProd = () => { const w=S.wos.find(x=>x.no===val('pe_wo')); const ok=+val('pe_ok'), rej=+val('pe_rej'); w.done=Math.min(w.qty,w.done+ok); w.rej+=rej; if(w.done>=w.qty) w.status='Completed'; if(w.status==='Planned') w.status='In progress';
  item(w.item).stock['FG Store P1']=(item(w.item).stock['FG Store P1']||0)+ok;
  S.boms[w.item].lines.forEach(([c,per])=>{ const it=item(c); const k=Object.keys(it.stock)[0]; it.stock[k]=Math.max(0,it.stock[k]-Math.round(per*(ok+rej))); });
  S.prodLog.unshift({date:dAgo(0),shift:val('pe_s'),wo:w.no,line:w.line,ok,rej,scrapKg:+val('pe_sc'),downMin:+val('pe_dt'),reason:val('pe_r'),op:'You'}); save(); route(); toast(`${N(ok)} pcs booked to FG · materials back-flushed from BOM`); };

function payCalc(e){
  const basic=Math.round(e.gross*0.5), hra=Math.round(e.gross*0.2), oth=e.gross-basic-hra;
  const pf=Math.round(Math.min(basic,15000)*0.12), esi=e.gross<=21000?Math.ceil(e.gross*0.0075):0, pt=0;
  const taxable=e.gross*12-75000; let tax=0; if(taxable>1200000){ const sl=[[400000,0],[800000,.05],[1200000,.10],[1600000,.15],[2000000,.20],[2400000,.25],[Infinity,.30]]; let prev=0; for(const [lim,r] of sl){ if(taxable>prev){ tax+=(Math.min(taxable,lim)-prev)*r; } prev=lim; } tax*=1.04; }
  const tds=Math.round(tax/12); const ded=pf+esi+pt+tds; const erPf=Math.round(Math.min(basic,15000)*0.12), erEsi=e.gross<=21000?Math.ceil(e.gross*0.0325):0;
  return {basic,hra,oth,pf,esi,pt,tds,ded,net:e.gross-ded,ctc:e.gross+erPf+erEsi};
}

function findRule(type, d){
  const D=DOCS[type]; const amt=D.amt(d)||0; const t=D.types?D.types(d):null;
  return (S.rules||[]).find(r=>r.doc===type && (!r.types||!r.types.length||r.types.includes(t)) && amt>=(r.min||0) && (r.max==null||amt<=r.max));
}
function resolveSteps(rule, type, d){ return (rule?rule.steps:[]).map(st=> st==='DEPT_HEAD' ? deptRole(DOCS[type].dept(d)) : st).filter((r,i,a)=>i===0||r!==a[i-1]); }
function startAppr(type, d, creatorRole, creatorName){
  const rule=findRule(type,d); let steps=resolveSteps(rule,type,d);
  const ap={rule:rule?rule.id:null, ruleName:rule?rule.name:'No rule matched', steps, at:0, sla:rule?rule.sla:24, startedAt:Date.now(), log:[]};
  // a requester never approves their own document: skip leading steps held by the requester's role
  while (ap.at<steps.length && steps[ap.at]===creatorRole){ ap.log.push({role:steps[ap.at],by:creatorName||'—',ok:true,auto:true,at:Date.now(),note:'Raised by this role'}); ap.at++; }
  d.ap=ap;
  if (ap.at>=steps.length){ DOCS[type].final(d,true); return 'auto-approved'; }
  if (ap.at>0 && DOCS[type].step) DOCS[type].step(d);
  return 'sent to '+roleName(steps[ap.at]);
}
function attachApprovals(s){
  for (const [type,D] of Object.entries(DOCS)) (s[D.col]||[]).forEach(d=>{
    if (!D.pending(d) || d.ap) return;
    const rule=findRule(type,d); const steps=resolveSteps(rule,type,d);
    let at=0; while (at<steps.length && d.byRole && steps[at]===d.byRole) at++; if (type==='indent' && d.hod) at=Math.max(at,1); if (type==='kaizen' && d.status==='Under evaluation') at=1; if (type==='review' && d.status==='HOD approval') at=1;
    d.ap={rule:rule?rule.id:null, ruleName:rule?rule.name:'—', steps, at:Math.min(at,Math.max(0,steps.length-1)), sla:rule?rule.sla:24, startedAt:Date.now()-((d.date?days(d.date):1)*864e5), log:at?[{role:steps[0],by:'(before go-live)',ok:true,at:Date.now()-864e5}]:[]};
  });
}
function buildApprovals(){
  const out=[]; if(!S) return out;
  for (const [type,D] of Object.entries(DOCS)) (S[D.col]||[]).forEach(d=>{
    if (!D.pending(d) || !d.ap || d.ap.at>=d.ap.steps.length) return;
    const role=d.ap.steps[d.ap.at];
    const ageH=(Date.now()-(d.ap.stepAt||d.ap.startedAt))/36e5;
    out.push({type, typeLabel:D.label, key:d[D.key], ref:type==='review'?d.cycle:String(d[D.key]).trim(), title:D.title(d), by:d.by||d.raisedBy||(type==='leave'?emp(d.emp).name:type==='kaizen'?emp(d.by).name:'—'),
      amt:D.amt(d), role, steps:d.ap.steps, at:d.ap.at, ageH, sla:d.ap.sla, over:ageH>d.ap.sla, rule:d.ap.ruleName, mine: !!CUR && (CUR.role===role)});
  });
  return out.sort((a,b)=>b.ageH-a.ageH);
}
function decide(type, key, ok, note){
  const D=DOCS[type]; const d=(S[D.col]||[]).find(x=>String(x[D.key])===String(key) && D.pending(x)); if(!d||!d.ap) { toast('Already decided by someone else'); route(); return; }
  const role=d.ap.steps[d.ap.at];
  if (CUR.role!==role && CUR.role!=='ADMIN'){ toast(`Waiting for ${roleName(role)}. You are signed in as ${ROLES[CUR.role].name}.`); return; }
  d.ap.log.push({role, by:CUR.name, asRole:CUR.role, ok, at:Date.now(), note:note||'', override:CUR.role!==role});
  let msg;
  if (!ok){ D.final(d,false); msg='rejected'; }
  else { d.ap.at++; d.ap.stepAt=Date.now(); if (d.ap.at>=d.ap.steps.length){ D.final(d,true); msg='approved (final)'; } else { if (D.step) D.step(d); msg='approved, sent to '+roleName(d.ap.steps[d.ap.at]); } }
  audit(`${ok?'Approved':'Rejected'} ${D.label}`, String(key).trim()+(CUR.role!==role?' (admin override)':''));
  save(); route(); toast(`${String(key).trim()} ${msg}`);
}

let DB=null, ROOM=null, SYNC='local', lastSent={}, writing={}, pendingKey=new Set(), peersNow=[];
function setSync(m){ SYNC=m; drawSync(); }

function syncPush(){
  if (!DB || SYNC==='ro') return;
  for (const k of Object.keys(S)){ const j=JSON.stringify(S[k]); if (lastSent[k]!==j) pendingKey.add(k); }
  pendingKey.forEach(k=>writeKey(k));
}
async function writeKey(k){
  if (writing[k]) return; writing[k]=true;
  try {
    while (pendingKey.has(k)){ pendingKey.delete(k); const j=JSON.stringify(S[k]); if (lastSent[k]===j) continue; lastSent[k]=j;
      await DB.doc('erp/'+k).set({v:S[k], by:CUR?CUR.name:'System', at:Date.now()}); }
  } catch(e){ if (e && (e.code==='invalid_argument' || e.code==='permission_denied' || e.code==='not_granted')){ setSync('ro'); toast('You can view the shared data, but changes stay on this device. Ask the owner for Contributor access.'); } else if (e && e.code==='resource_exhausted') { toast('Shared data is full; changes kept on this device.'); } }
  writing[k]=false;
}
function busy(){ return $('#drawer').classList.contains('on') || (document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName) && document.activeElement.closest('#view')); }
function applyRemote(docs, initial){
  let changed=false, by='';
  const before = CUR ? buildApprovals().filter(a=>a.mine).length : 0;
  docs.forEach(d=>{ if(!d.exists) return; const body=d.data(); const k=d.id; if(!body || !('v' in body)) return; const j=JSON.stringify(body.v); if (lastSent[k]===j && JSON.stringify(S[k])===j) return; if (writing[k] || pendingKey.has(k)) return; S[k]=body.v; lastSent[k]=j; changed=true; by=body.by||by; });
  if (!changed) return;
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
  if (CUR){ const u=(S.users||[]).find(x=>x.id===CUR.id); if(!u||!u.active){ ACT.logout(); return; } CUR=u; }
  if (!initial && CUR){ const after=buildApprovals().filter(a=>a.mine).length; if (after>before) toast(`${after-before} new item${after-before>1?'s':''} waiting for your approval`); else if (by && by!==CUR.name) toast(`Updated by ${by}`); }
  updateNavCounts();
  if (!CUR) { if(!$('#login').hidden) {} return; }
  if (busy()) window._pendingRender=true; else route();
}

// ---------- FEFO / FIFO stock issue (V-Rub: no negative stock, first-expiry-first-out) ----------
function lotExpiry(l){ const it=item(l.item); if(!it.shelf) return null; const d=new Date(l.rcv); d.setDate(d.getDate()+it.shelf); return d.toISOString().slice(0,10); }
function fefoPlan(code, qty, store){
  const it=item(code); const lots=S.lots.filter(l=>l.item===code && l.qty>0 && (!store||l.store===store)).map(l=>({...l,exp:lotExpiry(l)}));
  const usable=lots.filter(l=>!l.exp || l.exp>=dAgo(0)).sort((a,b)=> (a.exp||'9999').localeCompare(b.exp||'9999') || a.rcv.localeCompare(b.rcv));
  const expired=lots.filter(l=>l.exp && l.exp<dAgo(0));
  const total=stockOf(code); const lotTotal=sum(lots,l=>l.qty); const unlotted=Math.max(0,total-lotTotal);
  let need=qty; const picks=[];
  for (const l of usable){ if(need<=0) break; const q=Math.min(l.qty,need); picks.push({lot:l.lot,qty:q,exp:l.exp,rcv:l.rcv,store:l.store}); need-=q; }
  if (need>0 && unlotted>0){ const q=Math.min(unlotted,need); picks.push({lot:'(untracked opening stock)',qty:q,exp:null,rcv:null,store:Object.keys(it.stock)[0]}); need-=q; }
  const avail=sum(usable,l=>l.qty)+unlotted;
  return {picks, short:Math.max(0,need), expired, avail, ok:need<=1e-9};
}
function postIssue(code, plan){
  plan.picks.forEach(p=>{ const l=S.lots.find(x=>x.item===code && x.lot===p.lot); if(l) l.qty=+(l.qty-p.qty).toFixed(3); const it=item(code); const st=p.store||Object.keys(it.stock)[0]; it.stock[st]=Math.max(0,+((it.stock[st]||0)-p.qty).toFixed(3)); });
}
function planTable(code, plan){
  return table([{h:'Lot (pick order)',f:p=>`<span class="code">${esc(p.lot)}</span>`},{h:'Received',f:p=>p.rcv?fd(p.rcv):'—'},{h:'Expires',f:p=>p.exp?fd(p.exp)+' '+p.exp.slice(0,4):'No shelf life'},{h:'Store',f:p=>esc(p.store||'')},{h:'Issue',n:1,f:p=>N(p.qty)+' '+item(code).uom}],plan.picks)+
   (plan.expired.length?`<p class="small dn" style="margin:6px 0 0">Blocked: ${plan.expired.map(l=>esc(l.lot)+' expired '+fd(l.exp)).join(', ')}. Expired lots cannot be issued; move them to quarantine.</p>`:'')+
   (!plan.ok?`<p class="small no-t" style="margin:6px 0 0">Short by ${N(plan.short)} ${item(code).uom}. Negative stock is not allowed at V-Rub.</p>`:'');
}

// ---------- barcode (Code 39) & labels ----------
const C39={'0':'000110100','1':'100100001','2':'001100001','3':'101100000','4':'000110001','5':'100110000','6':'001110000','7':'000100101','8':'100100100','9':'001100100','A':'100001001','B':'001001001','C':'101001000','D':'000011001','E':'100011000','F':'001011000','G':'000001101','H':'100001100','I':'001001100','J':'000011100','K':'100000011','L':'001000011','M':'101000010','N':'000010011','O':'100010010','P':'001010010','Q':'000000111','R':'100000110','S':'001000110','T':'000010110','U':'110000001','V':'011000001','W':'111000000','X':'010010001','Y':'110010000','Z':'011010000','-':'010000101','.':'110000100',' ':'011000100','*':'010010100'};
function barcode(text){
  const t='*'+String(text).toUpperCase().replace(/[^0-9A-Z\-. ]/g,'-')+'*'; let x=0; const bars=[];
  for (const ch of t){ const p=C39[ch]; for (let i=0;i<9;i++){ const w=p[i]==='1'?3:1; if(i%2===0) bars.push([x,w]); x+=w; } x+=1; }
  return `<svg viewBox="0 0 ${x} 40" preserveAspectRatio="none" aria-label="Barcode ${esc(text)}">${bars.map(b=>`<rect x="${b[0]}" y="0" width="${b[1]}" height="40" fill="#111"/>`).join('')}</svg>`;
}
function labelHTML(o){ return `<div class="label"><div class="row"><span class="t">V-RUB SUSPENSIONS</span><span class="sp"></span><span>${esc(o.kind||'')}</span></div>${barcode(o.code)}<div style="text-align:center;letter-spacing:2px;font-weight:700">${esc(o.code)}</div><div style="margin-top:6px">${Object.entries(o.fields||{}).map(([k,v])=>`<div><b>${esc(k)}:</b> ${esc(v)}</div>`).join('')}</div></div>`; }
ACT.label = p => { const [kind,id]=p.split('|'); let o={code:id,kind};
  if (kind==='Batch'){ const b=S.batches.find(x=>x.no===id); o.fields={'Compound':cmp(b.compound).code+' · '+cmp(b.compound).name,'Weight':N(b.kg)+' kg','Mixed':b.mixedAt?new Date(b.mixedAt).toLocaleString('en-IN'):'Not yet','Usable from':b.mixedAt?new Date(b.mixedAt+cmp(b.compound).matureH*36e5).toLocaleString('en-IN'):'After maturation','Use before':b.mixedAt?new Date(b.mixedAt+cmp(b.compound).maxH*36e5).toLocaleString('en-IN'):'—','QA':b.qa||'Pending'}; }
  else if (kind==='GRN lot'){ const g=S.grns.find(x=>x.lot===id); const it=item(g.item); o.fields={'Item':it.code+' · '+it.name,'Qty':N(g.acc||g.qty)+' '+it.uom,'GRN':g.no,'Vendor':vend(g.vendor).name,'QA':g.qc}; if(it.shelf){ const e=lotExpiry({item:g.item,rcv:g.date}); o.fields['Expiry']=fd(e)+' '+e.slice(0,4);} }
  else { const w=S.wip.find(x=>x.id===id); if(w){ o.fields={'Part':w.item+' · '+partName(w.item),'Qty':N(w.qty),'Route':routeDef(w.route).name,'Stage':routeDef(w.route).stages[Math.min(w.stage,routeDef(w.route).stages.length-1)].n,'Created':new Date(w.createdAt).toLocaleString('en-IN')}; } }
  openDrawer('Label · '+id, labelHTML(o)+`<p class="small muted" style="margin-top:10px">Code 39 barcode. Scanned at the next stage to move the lot and check FIFO and expiry.</p>`, `<button class="btn" data-a="closeDrawer">Close</button><button class="btn pri" ${A('toast','Label sent to the stage label printer')}>Print label</button>`); };

// moulding / extrusion with maturation + FIFO check
ACT.mouldNew = route0 => { const isEx = route0==='EXTR'; const spec=isEx?EXTR_SPEC:MOULD_SPEC;
  openDrawer(isEx?'Start extrusion':'Start moulding', `<div class="form"><label>Part<select id="mo_p" onchange="ACT._mouldPlan()">${Object.keys(spec).map(k=>`<option value="${k}">${k} · ${esc(item(k).name)}</option>`).join('')}</select></label><label>Quantity (pcs)<input id="mo_q" type="number" value="${isEx?500:1500}" oninput="ACT._mouldPlan()"></label><input type="hidden" id="mo_r" value="${route0}"></div><div id="mo_plan" style="margin-top:12px"></div>`,
  `<button class="btn" data-a="closeDrawer">Cancel</button><button class="btn pri" id="mo_go" ${A('mouldSave')}>${isEx?'Start extrusion':'Start moulding'}</button>`); ACT._mouldPlan(); };
function fifoAlloc(list, need, qtyOf){ const out=[]; let left=need; for (const x of list){ if(left<=1e-9) break; const q=Math.min(qtyOf(x),left); if(q>0){ out.push([x,+q.toFixed(2)]); left-=q; } } return {out, short:Math.max(0,+left.toFixed(2))}; }
function mouldCtx(){ const isEx=val('mo_r')==='EXTR'; const part=val('mo_p'), q=+val('mo_q')||0; const sp=(isEx?EXTR_SPEC:MOULD_SPEC)[part]; const kg=+(sp.kg*q).toFixed(1);
  const bs=S.batches.filter(b=>b.compound===sp.c && ['Ready','Maturing','Awaiting QA','Expired'].includes(bStatus(b))).sort((a,b)=>(a.mixedAt||0)-(b.mixedAt||0));
  const ready=bs.filter(b=>bStatus(b)==='Ready'); const ba=fifoAlloc(ready,kg,b=>b.kgLeft);
  const ms = sp.metal ? S.wip.filter(w=>w.route==='METAL'&&w.item===sp.metal&&w.stage===6).sort((a,b)=>a.createdAt-b.createdAt) : [];
  const ma = sp.metal ? fifoAlloc(ms,q,m=>m.qty) : {out:[],short:0};
  return {isEx,part,q,sp,kg,bs,ready,ba,ms,ma};
}
ACT._mouldPlan = () => { const c=mouldCtx(); const {sp,kg,bs,ready,ba,ms,ma,isEx,q}=c;
  const used=new Map(ba.out.map(([b,k])=>[b.no,k])); const usedM=new Map(ma.out.map(([m,k])=>[m.id,k]));
  const checks=[
    [ready.length>0, ready.length?`Only matured, QA-approved ${sp.c} batches are offered (${ready.length} ready)`:`No ${sp.c} batch has finished maturation and QA`],
    [true, ba.out.length?`FIFO: ${ba.out.map(([b,k])=>`${b.no} (${N(k)} kg)`).join(' then ')}`:'FIFO: oldest batch first'],
    [ba.short===0, ba.short? `Short of compound by ${N(ba.short)} kg` : `Compound covered: ${N(kg)} kg`],
  ];
  const blocked=bs.filter(b=>['Maturing','Awaiting QA','Expired'].includes(bStatus(b)));
  if (blocked.length) checks.push([true, 'Held back: '+blocked.map(b=>`${b.no} ${bStatus(b)==='Awaiting QA'?'awaiting QA':bStatus(b).toLowerCase()}`).join(', ')]);
  if (sp.metal) checks.push([ma.short===0 && ms.length>0, ms.length? (ma.short?`Short of ${sp.metal} inserts by ${N(ma.short)} pcs`:`Metal inserts FIFO: ${ma.out.map(([m,k])=>`${m.id} (${N(k)})`).join(' then ')} · passed painting QA`) : `No ${sp.metal} lot has passed the QA gate before moulding`]);
  const ok=q>0 && checks.every(x=>x[0]);
  $('#mo_plan').innerHTML = `<div class="small muted" style="margin-bottom:6px">${sp.c} · ${sp.kg} kg per piece${sp.metal?` · insert ${sp.metal}`:''}${isEx?` · finish: ${sp.finish}`:''}</div>
    <label class="small" style="font-weight:600;color:var(--muted)">Compound batches, oldest first</label>${table([{h:'Batch',f:x=>`<span class="code">${x.no}</span>`},{h:'Status',f:x=>badge(bStatus(x))},{h:'Timer',f:x=>bTimer(x)},{h:'kg left',n:1,f:x=>N(x.kgLeft)},{h:'Use now',n:1,f:x=>used.has(x.no)?`<b>${N(used.get(x.no))} kg</b>`:'—'}],bs,{empty:'No batch of this compound.'})}
    ${sp.metal?`<label class="small" style="font-weight:600;color:var(--muted);display:block;margin-top:10px">Metal lots ready for moulding, oldest first</label>${table([{h:'Lot',f:x=>`<span class="code">${x.id}</span>`},{h:'Qty',n:1,f:x=>N(x.qty)},{h:'Ready since',f:x=>hrs((Date.now()-(x.hist.at(-1)||{}).at)/36e5)},{h:'Use now',n:1,f:x=>usedM.has(x.id)?`<b>${N(usedM.get(x.id))}</b>`:'—'}],ms,{empty:'No metal lot ready.'})}`:''}
    <div style="margin-top:10px">${checks.map(x=>`<div class="chk"><span class="${x[0]?'ok-t':'no-t'}">${x[0]?'✓':'✕'}</span><span>${esc(x[1])}</span></div>`).join('')}</div>`;
  const g=$('#mo_go'); if(g){ g.disabled=!ok; g.style.opacity=ok?1:.5; } };
ACT.mouldSave = () => { const c=mouldCtx(); if(!(c.q>0) || !c.ready.length || c.ba.short>0 || (c.sp.metal && (c.ma.short>0 || !c.ms.length))) return toast('Checks not met: matured, QA-approved compound and QA-passed inserts are needed, oldest first.');
  c.ba.out.forEach(([b,k])=>{ b.kgLeft=+(b.kgLeft-k).toFixed(1); });
  c.ma.out.forEach(([m,k])=>{ m.qty-=k; }); S.wip=S.wip.filter(w=>!(w.route==='METAL'&&w.qty<=0));
  const id=(c.isEx?'EX-2610-0'+(S.seq.ex++):'MO-2610-'+(S.seq.mo++));
  S.wip.unshift({id,route:c.isEx?'EXTR':'MOULD',item:c.part,qty:c.q,stage:0,createdAt:Date.now(),hist:[{stage:0,at:Date.now(),by:CUR.name}],src:[...c.ba.out.map(([b])=>({batch:b.no})),...c.ma.out.map(([m])=>({metal:m.id}))]});
  audit(`Started ${c.isEx?'extrusion':'moulding'} (maturation & FIFO checked)`, id); save(); closeDrawer(); route(); toast(`${id} started · used ${c.ba.out.map(([b])=>b.no).join(', ')}${c.ma.out.length?' + '+c.ma.out.map(([m])=>m.id).join(', '):''} (FIFO)`); };

ACT.qaSave = p => { const [kind,id]=p.split('|'); const res=val('qa_res'); const ok=res!=='Rejected';
  if (kind==='grn'){ const g=S.grns.find(x=>x.no===id); const it=item(g.item); const acc=ok?Math.min(+val('qa_acc'),g.qty):0; const st=g.store||Object.keys(it.stock)[0];
    g.acc=acc; g.rej=g.qty-acc; g.qc=!ok?'Rejected':acc<g.qty?'Partly rejected':'Accepted'; g.qaBy=CUR.name;
    if (acc>0){ it.stock[st]=(it.stock[st]||0)+acc; S.lots.push({item:g.item,lot:g.lot,qty:acc,rcv:g.date,store:st}); }
    audit('Incoming QA '+g.qc, id); save(); closeDrawer(); route(); if(acc>0) ACT.label('GRN lot|'+g.lot); toast(`${id}: ${g.qc}${acc?' · '+N(acc)+' '+it.uom+' moved to '+st:''}`); return; }
  if (kind==='batch'){ const b=S.batches.find(x=>x.no===id); const c=cmp(b.compound); const h=+val('qa_h'); const inSpec=h>=c.hard[0]&&h<=c.hard[1];
    if (ok && !inSpec) return toast(`Hardness ${h} is outside ${c.hard[0]}–${c.hard[1]}. Record as Rejected or recheck.`);
    b.qa=ok?'Approved':'Rejected'; b.hardness=h; b.qaBy=CUR.name; if(!ok) b.stage='Rejected'; audit('Compound QA '+b.qa, id); save(); closeDrawer(); route(); toast(`${id} ${ok?'released for moulding (FIFO)':'rejected'}`); return; }
  const w=S.wip.find(x=>x.id===id); const acc=ok?Math.min(+val('qa_acc'),w.qty):0; const rej=w.qty-acc;
  if (!ok || acc<=0){ S.wip=S.wip.filter(x=>x!==w); S.ncrs.unshift({no:'NCR-26-0'+(S.seq.ncr++),src:'In-process',ref:id,item:w.item.startsWith('MT-')?'RM-MT-007':w.item,issue:'Lot rejected at '+ROUTES[w.route].stages[w.stage].n,d:'D1 Team',owner:CUR.name,date:dAgo(0)}); }
  else { w.qty=acc; w.stage++; w.hist.push({stage:w.stage,at:Date.now(),by:CUR.name,qa:true}); if(rej>0) S.ncrs.unshift({no:'NCR-26-0'+(S.seq.ncr++),src:'In-process',ref:id,item:w.item.startsWith('MT-')?'RM-MT-007':w.item,issue:`${rej} pcs rejected at QA`,d:'D1 Team',owner:CUR.name,date:dAgo(0)}); }
  audit(`QA ${ok?'passed':'rejected'} lot`, id); save(); closeDrawer(); route(); toast(ok?`${id} passed QA → ${ROUTES[w.route].stages[w.stage].n}`:`${id} rejected · NCR raised`); };

{ const _q = PAGES.quality; PAGES.quality = (tab='stageqa', a) => {

function normRows(rows, file){
  const pick=(o,res)=>{ for(const k of Object.keys(o)){ if(res.test(k.replace(/\s+/g,' ').trim())) return o[k]; } return ''; };
  const out=rows.map((o,i)=>{ let d=pick(o,/date|deliv|due/i); if(typeof d==='number'){ const dt=new Date(Math.round((d-25569)*864e5)); d=dt.toISOString().slice(0,10);} else if(d){ const m=String(d).match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/); if(m){ const y=m[3].length===2?'20'+m[3]:m[3]; d=`${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; } else { const t=new Date(d); d=isNaN(t)?String(d):t.toISOString().slice(0,10);} }
    const r={row:i+2,cust:String(pick(o,/cust.*(code|id)|^customer$/i)).trim(),custPo:String(pick(o,/po|order/i)).trim(),item:String(pick(o,/part|item|material/i)).trim().toUpperCase(),date:String(d||''),qty:+String(pick(o,/qty|quantity/i)).replace(/,/g,'')};

    return r; });
  out.file=file; return out;
}
function parseCSV(t){ const lines=t.replace(/\r/g,'').split('\n').filter(x=>x.trim()); const sp=l=>{ const o=[]; let c='',q=false; for(const ch of l){ if(ch==='"'){q=!q;continue;} if(ch===','&&!q){o.push(c);c='';} else c+=ch; } o.push(c); return o; };
  const h=sp(lines[0]); return lines.slice(1).map(l=>{ const v=sp(l); const o={}; h.forEach((k,i)=>o[k]=v[i]); return o; }); }

  S.users.push({id,name:val('nu_n').trim(),role:val('nu_r'),dept:val('nu_d'),plants:val('nu_p'),pw:hashPw(val('nu_pw')),active:true}); audit('Created user',id); save(); closeDrawer(); route(); toast(`User ${id} created. They can sign in now.`); };
ACT.ruleEdit = id => { const r=S.rules.find(x=>x.id===id); const sel=(v,i)=>`<select class="inline-sel" data-step="${i}">${STEP_OPTS.map(([k,l])=>`<option value="${k}" ${k===v?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
  openDrawer('Edit rule · '+r.name, `<div class="form"><label class="full">Name<input id="ru_n" value="${esc(r.name)}"></label><label>Value from (₹)<input id="ru_min" type="number" value="${r.min||0}"></label><label>Value to (₹, blank = no limit)<input id="ru_max" type="number" value="${r.max??''}"></label><label>SLA per level (hours)<input id="ru_sla" type="number" value="${r.sla}"></label><label>Applies to types<input id="ru_t" value="${(r.types||[]).join(', ')}" placeholder="blank = all"></label></div>
   <h3 style="font:700 14px var(--head);margin:14px 0 6px">Approval levels, in order</h3><div id="ru_steps">${r.steps.map((s,i)=>`<div class="row" style="margin-bottom:6px"><b style="width:28px">L${i+1}</b>${sel(s,i)}</div>`).join('')}</div>
   <div class="row" style="margin-top:6px"><button class="btn sm" ${A('ruleAddStep',id)}>Add level</button><button class="btn sm no" ${A('ruleDelStep',id)}>Remove last level</button><button class="btn sm no" ${A('ruleDel',id)}>Delete rule</button></div>
   <p class="small muted">Changes apply to documents submitted from now on. Documents already in approval keep the route they started with.</p>`, `<button class="btn" data-a="closeDrawer">Cancel</button><button class="btn pri" ${A('ruleSave',id)}>Save rule</button>`); };
function readRuleForm(r){ r.name=val('ru_n')||r.name; r.min=+val('ru_min')||0; r.max=val('ru_max')===''?null:+val('ru_max'); r.sla=+val('ru_sla')||24; r.types=val('ru_t').split(',').map(x=>x.trim()).filter(Boolean); r.steps=[...document.querySelectorAll('#ru_steps [data-step]')].map(s=>s.value); }
ACT.ruleAddStep = id => { const r=S.rules.find(x=>x.id===id); readRuleForm(r); r.steps.push('PLANT_HEAD'); ACT.ruleEdit(id); };
ACT.ruleDelStep = id => { const r=S.rules.find(x=>x.id===id); readRuleForm(r); r.steps.pop(); ACT.ruleEdit(id); };
ACT.ruleSave = id => { const r=S.rules.find(x=>x.id===id); readRuleForm(r); audit('Changed approval rule',r.name); save(); closeDrawer(); route(); toast('Approval rule saved'); };
ACT.ruleDel = id => { if(!confirm('Delete this rule?')) return; S.rules=S.rules.filter(x=>x.id!==id); audit('Deleted approval rule',id); save(); closeDrawer(); route(); };
ACT.ruleAdd = doc => { const id='R-'+doc.toUpperCase()+'-'+Date.now().toString(36).slice(-4); S.rules.push({id,doc,name:DOCS[doc].label+' · new band',types:[],min:0,max:null,steps:['PLANT_HEAD'],sla:24}); save(); ACT.ruleEdit(id); };

const VRULES = [
  ['Procurement','Allowed excess receipt over PO quantity','Yes (10%)','GRN refuses more than pending + 10%','grnTolPct','applied'],
  ['Procurement','Price difference between PO and supplier invoice','No','0% tolerance; any rate variance holds the invoice for Finance','priceTolPct','applied'],
  ['Procurement','Cash purchase limit and monthly petty cash','To be decided later','Configurable; no limit enforced until V-Rub decides','cashLimit','pending'],
  ['Procurement','Minimum quotations before a PO','To be decided later','Configurable; not enforced yet','minQuotes','pending'],
  ['Procurement','PO without an approved indent','Yes during initial stage, but build release-after-approved-indent','Switch below: off = allowed now, on = PO needs an approved indent','requireIndent','applied'],
  ['Procurement','Vendor payment terms; MSME within 45 days','Not answered','MSME 45-day tracking on by default (statutory)','','open'],
  ['Stores','Stock valuation method','FIFO','Inventory valued FIFO','valuation','applied'],
  ['Stores','Negative stock','No','Issue, transfer, dispatch and moulding block when stock is short','negativeStock','applied'],
  ['Stores','Issue rule for lots','First expiry first out','FEFO picking on every issue; expired lots blocked','issueRule','applied'],
  ['Stores','Physical stock count','Monthly','Monthly count sheet per store; variance posts after approval','countFreq','applied'],
  ['Sales','Customer payment terms by type','Not answered','Terms kept per customer billing code','','open'],
  ['Sales','Block invoicing over credit limit / overdue','Not answered','Warn only until V-Rub decides','','open'],
  ['Sales','Margin below which quote needs MD','To be decided later','Configurable; not enforced yet','marginMD','pending'],
  ['Sales','OEM delivery schedules','Excel / email','Schedule import from Excel or the sales mailbox','schedFormat','applied'],
  ['Production','How production is reported','Per shift','Shift production entry (A/B/C); shift-end missed-entry alert','prodReporting','applied'],
  ['Production','Back-flush or actual issue','Actual issue','No back-flush; material issued FEFO against batch / WO','consumption','applied'],
  ['Production','Rejection % target per line','Not answered','Shown without target','','open'],
  ['Finance','Separate GSTINs with inter-unit invoices','Yes','Inter-plant transfers raise inter-unit invoice + e-way bill','interUnit','applied'],
  ['Finance','Period lock','Last day of month for all; production first day of next month','Posting refused in closed periods; production open until day 1','lockDay','applied'],
  ['Finance','Who can post into a closed period','Not answered','Nobody until V-Rub names the role','','open'],
  ['Finance','Banks; host-to-host or manual','Not answered','Bank file export ready; H2H on confirmation','','open'],
  ['HR','Shifts, leave entitlement, overtime, payroll dates, attendance devices','Not answered','Demo defaults (CL 7 · SL 7 · EL 15)','','open'],
  ['HR','Appraisal cycle','Yearly','Annual review cycle FY 2026-27','appraisal','applied'],
  ['General','Who can create or change masters','Not answered','Admin and module owners for now','','open'],
  ['General','Document numbering format','Not answered','PO-26-0861 style; editable','','open'],
  ['General','Language on screen and WhatsApp','English','English UI and messages','language','applied'],
];
function rulesView(){
  const st=s=>s==='applied'?badge('Applied'):s==='pending'?'<span class="b a">Configurable · awaiting decision</span>':'<span class="b x">Not answered</span>';
  const ed = CUR.role==='ADMIN';
  const n=k=>VRULES.filter(r=>r[5]===k).length;
  return `<div class="grid g3" style="margin-bottom:14px">${kpi('Answered & applied',n('applied'))}${kpi('Awaiting V-Rub decision',n('pending'))}${kpi('Not answered yet',n('open'))}</div>
  <div class="card" style="margin-bottom:14px"><h3>Settings V-Rub can change</h3><div class="form">
   <label class="full" style="flex-direction:row;align-items:center;gap:10px"><input type="checkbox" id="st_ri" ${S.settings.requireIndent?'checked':''} ${ed?'':'disabled'} onchange="ACT.setToggle(this)"> Require an approved indent before any PO <span class="small muted">(off during the initial stage, as V-Rub asked)</span></label>
   <label>GRN excess tolerance (%)<input id="st_grn" type="number" value="${S.settings.grnTolPct}" ${ed?'':'disabled'}></label><label>PO vs invoice price tolerance (%)<input id="st_pr" type="number" value="${S.settings.priceTolPct}" ${ed?'':'disabled'}></label>
   <label>Cash purchase limit per bill (₹)<input id="st_cash" type="number" value="${S.settings.cashLimit??''}" placeholder="to be decided" ${ed?'':'disabled'}></label><label>Minimum quotations before PO<input id="st_mq" type="number" value="${S.settings.minQuotes??''}" placeholder="to be decided" ${ed?'':'disabled'}></label>
   <label>Quote margin needing MD approval (%)<input id="st_mg" type="number" value="${S.settings.marginMD??''}" placeholder="to be decided" ${ed?'':'disabled'}></label><label>Production stays open into next month (days)<input id="st_pl" type="number" value="${S.settings.prodLockExtraDays}" ${ed?'':'disabled'}></label></div>
   ${ed?`<div class="row" style="margin-top:10px"><button class="btn pri" ${A('setSave')}>Save settings</button></div>`:''}</div>
  <div class="card flush">${table([{h:'Area',k:0},{h:'Question',k:1},{h:'V-Rub answer',f:r=>`<b>${esc(r[2])}</b>`},{h:'How heyyERP applies it',k:3},{h:'Status',f:r=>st(r[5])}],VRULES)}</div>
  <p class="note" style="margin-top:12px">Source: V-Rub_heyyERP_Workflow_Approval_Template, sheet 7 (Business Rules). Sheets 1–6 and 8 (company setup, people, approval matrix, process list, as-is flows, alerts, sign-off) were not returned.</p>`;
}
ACT.setToggle = el => { if(CUR.role!=='ADMIN') return; S.settings.requireIndent=el.checked; audit('Changed rule: require indent before PO', el.checked?'On':'Off'); save(); toast(el.checked?'POs now need an approved indent':'POs allowed without an indent (initial stage)'); };
ACT.setSave = () => { const n=v=>v===''?null:+v; S.settings.grnTolPct=+val('st_grn')||0; S.settings.priceTolPct=+val('st_pr')||0; S.settings.cashLimit=n(val('st_cash')); S.settings.minQuotes=n(val('st_mq')); S.settings.marginMD=n(val('st_mg')); S.settings.prodLockExtraDays=+val('st_pl')||0; audit('Changed business rule settings',''); save(); route(); toast('Settings saved'); };
function flowView(){
  const lane=(cls,t,steps)=>`<div class="lane ${cls}"><h3>${t}</h3><div class="stages">${steps.map((s,i)=>`<div class="stg"><div class="nd ${/QA/.test(s)?'qa':''}" style="cursor:default"><b>${esc(s)}</b></div>${i<steps.length-1?'<span class="ar">→</span>':''}</div>`).join('')}</div></div>`;
  return `<p class="small muted" style="margin-top:0">As received from V-Rub (PFD, 3 Oct 2026). The live version with counts and actions is in Production routes.</p>`+
   lane('metal','Metal parts',['Vendor approval','PO & schedule','RM receipt','Store, barcoding, QA approval','Machining','QA check','Phosphating, barcoding','QA check & issue to painting','Painting','QA check & issue to moulding','→ Moulding'])+
   lane('rub','Rubber moulded parts',['Vendor approval','PO & schedule','RM receipt','Store, barcoding, QA approval','Issue for production, check FIFO & expiry','Batch weighing, barcoding','Mixing','Maturation, QA approval','Moulding (check maturation completion, FIFO)','QA check','Packing, barcoding','FG store, despatch'])+
   lane('ext','Extruded parts',['Vendor approval','PO & schedule','RM receipt','Store, barcoding, QA approval','Issue for production, check FIFO & expiry','Batch weighing, barcoding','Mixing','Maturation, QA approval','Extrusion','Joint moulding or flocking','→ QA check, packing, FG'])+
   `<div class="card"><h3>How each step is enforced</h3>${table([{h:'Step',k:0},{h:'In heyyERP',k:1}],[
    ['Vendor approval','New vendors are Pending until approved; POs list approved vendors only'],['PO & schedule','PO with split delivery schedule; supplier follow-up on late lines'],
    ['RM receipt → Store, barcoding, QA approval','GRN (≤10% excess) goes to QA hold; Quality accepts; lot barcode label printed; stock enters store'],
    ['Issue for production, FIFO & expiry','FEFO lot picking; expired lots blocked; no negative stock'],['Batch weighing, barcoding','Recipe targets vs actual weights; batch barcode'],
    ['Mixing → Maturation, QA approval','Maturation timer per compound; QA records hardness, t90, SG; out-of-spec cannot pass'],
    ['Moulding (maturation, FIFO)','Only matured, QA-approved batches; oldest first; metal insert lot must have passed painting QA, oldest first'],
    ['Machining → Phosphating → Painting','Lot traveller with QA gates after machining, before painting and before moulding'],
    ['Extrusion → Joint moulding or flocking','Uses EPDM compound batches by FIFO; joins common QA check'],['QA check → Packing, barcoding → FG store, despatch','Final QA gate; packing books FG stock with a lot label; despatch picks FG FIFO']])}</div>`;
}
